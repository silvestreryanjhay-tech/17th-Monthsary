<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 17th Monthsary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe4ea; --bg2:#f4d9ff; --ink:#4a1630; --soft:#8a4a64; --rose:#e8466a;
  --gold:#f2b94b; --card:#fff8fa; --line:#f3b9c9;
  --serif:"Fraunces",Georgia,serif; --hand:"Caveat","Segoe Script",cursive; --sans:"Nunito",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2a0f1f;--bg2:#1d1233;--ink:#ffe9ef;--soft:#e9b4c6;--card:#3a1630;--line:#6b2c4b;}
}
:root[data-theme="dark"]{--bg1:#2a0f1f;--bg2:#1d1233;--ink:#ffe9ef;--soft:#e9b4c6;--card:#3a1630;--line:#6b2c4b;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-30px;width:14px;height:18px;background:var(--rose);opacity:.55;border-radius:80% 0 80% 0;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg) translateX(40px)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:28px 20px 70px}
section{display:none}
section.on{display:block}

/* envelope */
#intro{text-align:center;padding-top:8vh}
#intro h1{font-family:var(--hand);font-size:clamp(2.2rem,8vw,3.2rem);margin:0 0 6px;font-weight:700}
#intro p{margin:0 0 36px;color:var(--soft)}
.env{position:relative;width:min(300px,80vw);height:200px;margin:0 auto;cursor:pointer;border:0;background:none;padding:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.env .body{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:10px;box-shadow:0 14px 30px rgba(120,30,70,.18)}
.env .flap{position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(#ffd3de,#ffc2d2);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0;transform-origin:top;transition:transform .7s}
.env .seal{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:opacity .3s}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:8px;border-radius:12px}
.env.open{animation:none}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0}
.hint{font-family:var(--hand);font-size:1.5rem;color:var(--rose);margin-top:30px}

/* letter */
.badge{text-align:center;font-family:var(--hand);font-size:1.7rem;color:var(--rose);margin:4px 0 14px}
.letter{position:relative;background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 18px;border:1px solid var(--line);border-radius:6px 6px 26px 6px;padding:30px 22px 30px 54px;box-shadow:0 18px 40px rgba(120,30,70,.15);animation:rise .9s ease both}
.letter::before{content:"";position:absolute;top:0;bottom:0;left:38px;width:2px;background:var(--rose);opacity:.35}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}}
.letter h2{font-family:var(--hand);font-weight:700;font-size:2.5rem;line-height:44px;margin:0 0 14px;color:var(--rose)}
.count{font-family:var(--hand);font-size:1.6rem;color:var(--rose);margin:0 0 18px}
.letter p{font-family:var(--hand);font-weight:500;font-size:1.5rem;line-height:32px;max-width:56ch;margin:0 0 20px}
.letter .sign{font-weight:700;font-size:2.2rem;color:var(--rose);margin:26px 0 10px}
.letter .ps{font-size:1.3rem;color:var(--soft)}
.stats{display:flex;gap:10px;margin:22px 0}
.stat{flex:1;text-align:center;border:1px dashed var(--line);border-radius:14px;padding:12px 4px}
.stat b{display:block;font-family:var(--serif);font-size:1.7rem}
.stat span{font-size:.85rem;color:var(--soft)}
.btn{display:inline-block;font:600 1rem var(--sans);color:#fff;background:var(--rose);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 18px rgba(232,70,106,.35);transition:transform .15s}
.btn:hover{transform:scale(1.04)}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.center{text-align:center;margin-top:26px}

/* reasons */
#reasons h2{font-family:var(--hand);font-size:2.4rem;text-align:center;margin:10px 0 4px}
#reasons .sub{text-align:center;color:var(--soft);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.tile{aspect-ratio:1;border:2px solid var(--line);border-radius:16px;background:var(--card);font:600 1.3rem var(--serif);color:var(--rose);cursor:pointer;display:grid;place-items:center;position:relative}
.tile.done{background:var(--rose);color:#fff;border-color:var(--rose)}
.reason{min-height:96px;margin:22px 0 0;padding:18px 20px;background:var(--card);border-left:5px solid var(--rose);border-radius:12px;font-family:var(--serif);font-size:1.12rem;line-height:1.6}
.prog{text-align:center;color:var(--soft);margin-top:14px;font-size:.95rem}

/* finale */
#finale{text-align:center;padding-top:10vh}
#finale h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,8vw,3rem);margin:0 0 10px}
#finale p{font-family:var(--hand);font-size:1.9rem;color:var(--rose);margin:0 0 30px}
.big{font-size:84px;display:inline-block;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.pop{position:fixed;pointer-events:none;z-index:5;font-size:22px;animation:pop 1.6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.petal,.env,.big,.letter{animation:none}.petals{display:none}.env .flap{transition:none}}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main>

<section id="intro" class="on">
  <h1>Something for you, <span id="n1"></span></h1>
  <p>Tap the envelope</p>
  <button class="env" id="env" aria-label="Open the envelope">
    <div class="body"></div><div class="flap"></div><div class="seal">♥</div>
  </button>
  <div class="hint">psst… it’s from me</div>
</section>

<section id="letter">
  <p class="badge">Happy 17th Monthsary 💌</p>
  <article class="letter">
    <h2>Dear <span id="n2"></span>,</h2>
    <div id="body"></div>
    <p class="sign" id="sign"></p>
    <p class="ps" id="ps"></p>
    <div class="stats">
      <div class="stat"><b>17</b><span>months</span></div>
      <div class="stat"><b id="days">0</b><span>days</span></div>
      <div class="stat"><b>1</b><span>favorite person</span></div>
    </div>
  </article>
  <div class="center"><button class="btn" data-go="reasons">Read my 17 reasons</button></div>
</section>

<section id="reasons">
  <h2>17 reasons I love you</h2>
  <p class="sub">Tap each heart. One for every month.</p>
  <div class="grid" id="grid"></div>
  <div class="reason" id="reason" aria-live="polite">Pick a number to begin.</div>
  <div class="prog" id="prog">0 / 17 opened</div>
  <div class="center" id="nextWrap" hidden><button class="btn" data-go="finale">One last thing</button></div>
</section>

<section id="finale">
  <div class="big" aria-hidden="true">💖</div>
  <h2>Here’s to many more months</h2>
  <p id="fin"></p>
  <button class="btn" id="yes">Yes, forever</button>
</section>

</main>
<script>
/* ====== EDIT THESE ====== */
const HER = "Babyyy";                 // her name or nickname
const YOU = "Your Babyyy";               // how you sign the letter
const START = new Date(2025, 5, 22);   // the day you became a couple (year, month 0-11, day)
const LETTER = [
  "Seventeen months in, and what I love most is how easy it feels to be with you. We’ve learned each other’s moods and each other’s ways, and somehow that makes every day with you feel like home.",
  "We’re not perfect, and some days are heavy. But you and I keep showing up, talking things through, and choosing each other. That’s the kind of love I want to keep building with you.",
  "Thank you for every effort you make for me, the loud ones and the quiet ones. I notice all of them, and they mean the world to me.",
  "Let’s keep chasing our dreams, in school and beyond, and cheer each other on when it gets tiring. I can’t wait to celebrate our wins together someday.",
  "Happy 17th monthsary, babyyy. I’m so proud of us, and I love you, today and always."
];
const PS = "P.S. Thank you for being my person.";
const REASONS = [
  "Your smile fixes my worst days.",
  "You listen, really listen.",
  "You make plain food taste better, just by sharing it.",
  "Your laugh is my favorite sound.",
  "You’re kind to everyone, even when it’s hard.",
  "You believe in me when I forget to.",
  "Your hugs feel like home.",
  "You’re beautiful inside and out.",
  "You make our little inside jokes the best jokes.",
  "You’re strong, and you’re gentle too.",
  "You care about the small things.",
  "You’re my best friend.",
  "You make the future feel exciting.",
  "You put up with my silly side.",
  "Every date with you is my favorite date.",
  "You make me want to be better.",
  "Because it’s you. Always you."
];
const FINAL = "I love you, " + "always.";
/* ======================== */

const $ = s => document.querySelector(s);
["n1","n2"].forEach(id => $("#"+id).textContent = HER);
$("#sign").textContent = YOU;
$("#ps").textContent = PS;
$("#fin").textContent = FINAL;
$("#body").innerHTML = LETTER.map(t => "<p>"+t+"</p>").join("");
$("#days").textContent = Math.max(0, Math.floor((new Date() - START) / 864e5));

function reveal(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  document.querySelectorAll(".letter h2,.letter p").forEach((el,i)=>{
    el.style.transition="none"; el.style.opacity=0; el.style.transform="translateY(10px)";
    setTimeout(()=>{el.style.transition="opacity .8s, transform .8s"; el.style.opacity=1; el.style.transform="none";},350+i*700);
  });
}
function show(id){
  if(id==="letter") reveal();
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo({top:0, behavior:"smooth"});
  try{ history.replaceState(null,"","#"+id); }catch(e){}
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

$("#env").addEventListener("click", e => {
  e.currentTarget.classList.add("open");
  burst(e.clientX, e.clientY, 8);
  setTimeout(() => show("letter"), 900);
});

/* reasons grid */
const opened = new Set();
REASONS.forEach((r,i) => {
  const t = document.createElement("button");
  t.className = "tile"; t.textContent = i+1; t.setAttribute("aria-label","Reason "+(i+1));
  t.addEventListener("click", () => {
    $("#reason").textContent = (i+1) + ". " + r;
    t.classList.add("done"); t.textContent = "♥";
    opened.add(i);
    $("#prog").textContent = opened.size + " / 17 opened";
    if (opened.size === REASONS.length) $("#nextWrap").hidden = false;
  });
  $("#grid").appendChild(t);
});

/* hearts burst */
function burst(x, y, n){
  for(let i=0;i<n;i++){
    const h = document.createElement("div");
    h.className = "pop"; h.textContent = ["💗","💖","🌸","💕"][i%4];
    h.style.left = x+"px"; h.style.top = y+"px";
    const a = Math.random()*Math.PI*2, d = 70+Math.random()*120;
    h.style.setProperty("--x", Math.cos(a)*d+"px");
    h.style.setProperty("--y", Math.sin(a)*d-40+"px");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1700);
  }
}
$("#yes").addEventListener("click", e => { burst(e.clientX, e.clientY, 22); $("#yes").textContent = "I knew it 💕"; });

/* falling petals */
const P = $("#petals");
for(let i=0;i<14;i++){
  const p = document.createElement("i");
  p.className = "petal";
  p.style.left = Math.random()*100+"%";
  p.style.animationDuration = (9+Math.random()*9)+"s";
  p.style.animationDelay = (-Math.random()*14)+"s";
  p.style.transform = "scale("+(0.6+Math.random()*0.9)+")";
  P.appendChild(p);
}
</script>
</body>
</html>
